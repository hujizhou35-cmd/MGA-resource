name: Prepare cloud visual review
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Collection release
        default: collection-20261106
        type: string
      assembly_prefix:
        description: Exact assembly-RUN-ATTEMPT prefix from the assembled catalog
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: visual-review-${{ inputs.assembly_prefix }}
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Install bilingual contact-sheet font
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Stream selected previews and publish blank review pack
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECTION_TAG: ${{ inputs.release_tag }}
          ASSEMBLY_PREFIX: ${{ inputs.assembly_prefix }}
        run: python scripts/build_review.py --release-tag "$COLLECTION_TAG" --assembly-prefix "$ASSEMBLY_PREFIX" --publish
