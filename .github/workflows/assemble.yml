name: Assemble cloud catalog
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Collection release to assemble'
        default: 'collection-20261106'
        type: string
permissions:
  contents: write
concurrency:
  group: assemble-catalog
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Consolidate cloud records and prepare acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECTION_TAG: ${{ inputs.release_tag }}
        run: python scripts/assemble.py --release-tag "$COLLECTION_TAG" --publish
