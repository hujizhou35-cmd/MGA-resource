name: Assemble cloud catalog
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Input collection checkpoints and original archives (not output)'
        default: 'collection-20261106'
        type: string
      publish_tag:
        description: 'Existing Release for new catalog outputs; also checked for review evidence'
        default: 'acceptance-20261107'
        type: string
      evidence_release_tag:
        description: 'Additional existing scientific/scope review evidence Release'
        default: 'acceptance-20261107'
        type: string
permissions:
  contents: write
concurrency:
  group: assemble-catalog
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Consolidate cloud records and prepare acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECTION_TAG: ${{ inputs.release_tag }}
          PUBLISH_TAG: ${{ inputs.publish_tag }}
          EVIDENCE_TAG: ${{ inputs.evidence_release_tag }}
        run: |
          extra=()
          if [ -n "$EVIDENCE_TAG" ]; then extra+=(--evidence-release-tag "$EVIDENCE_TAG"); fi
          python scripts/assemble.py --release-tag "$COLLECTION_TAG" --publish-tag "$PUBLISH_TAG" "${extra[@]}" --publish
