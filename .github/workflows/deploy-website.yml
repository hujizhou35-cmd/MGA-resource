name: Deploy free accepted website
on:
  workflow_dispatch:
    inputs:
      prepare_run:
        type: string
        default: '43485204419'
        required: true
      stage:
        type: choice
        options: [database, files, site]
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: website-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 104f09363abf61ba85c8266b39593ceb
      GH_TOKEN: ${{ github.token }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
        working-directory: site
      - name: Reuse cloud export without reacquisition
        uses: actions/download-artifact@v4
        with:
          name: website-prepared-${{ inputs.prepare_run }}
          run-id: ${{ inputs.prepare_run }}
          github-token: ${{ github.token }}
          path: build/website
      - run: python -m pip install -e .
      - name: Verify accepted preparation and free plan checkpoint
        run: python scripts/verify_website_prepared.py
      - name: Import D1 once
        if: inputs.stage == 'database'
        working-directory: site
        run: |
          npx wrangler d1 execute mga-resource-search-v13 --remote --command "SELECT count(*) AS existing_tables FROM sqlite_schema WHERE name='file_variants'" --json > ../build/website/database-before.json
          python ../scripts/check_empty_website_db.py
          npx wrangler d1 execute mga-resource-search-v13 --remote --file ../build/website/search.sql --json > ../build/website/database-import.json
          npx wrangler d1 execute mga-resource-search-v13 --remote --command "SELECT count(*) AS variants FROM file_variants; SELECT key,value FROM index_metadata;" --json > ../build/website/database-after.json
      - name: Restore and publish static originals and previews
        if: inputs.stage == 'files'
        run: python scripts/deploy_website_files.py
      - name: Deploy frontend and shared search API
        if: inputs.stage == 'site'
        working-directory: site
        run: |
          cp -r public/. ../build/website/public/
          npx wrangler pages deploy ../build/website/public --project-name mga-resource-mainly-for-agent --branch main --commit-dirty=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-${{ inputs.stage }}-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            build/website/database-*.json
            build/website-files/*deployment*.txt
            build/website-files/files-deployment.json
