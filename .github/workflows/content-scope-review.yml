name: Review finished information product candidates
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing collection release
        default: collection-20261106
        type: string
      assembly_prefix:
        description: Exact assembly-RUN-ATTEMPT
        required: true
        type: string
      archive_release_tag:
        description: Original and preview archive Release
        default: collection-20261106
        type: string
      publish_tag:
        description: Separate review evidence output Release
        default: acceptance-20261107
        type: string
      offset:
        description: File candidate offset, zero based
        default: '0'
        type: string
      limit:
        description: Maximum files, 1-1000
        default: '1000'
        type: string
      source_filter:
        description: Optional exact source, e.g. reactome
        default: ''
        type: string
      full_source:
        description: Nominate every file of the explicit source filter
        default: false
        type: boolean
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Review existing previews without source recollection
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECTION_TAG: ${{ inputs.release_tag }}
          ASSEMBLY_PREFIX: ${{ inputs.assembly_prefix }}
          ARCHIVE_TAG: ${{ inputs.archive_release_tag }}
          PUBLISH_TAG: ${{ inputs.publish_tag }}
          RANGE_OFFSET: ${{ inputs.offset }}
          RANGE_LIMIT: ${{ inputs.limit }}
          SOURCE_FILTER: ${{ inputs.source_filter }}
          FULL_SOURCE: ${{ inputs.full_source }}
        run: |
          args=()
          if [ -n "$SOURCE_FILTER" ]; then args+=(--source-filter "$SOURCE_FILTER"); fi
          if [ "$FULL_SOURCE" = "true" ]; then args+=(--full-source); fi
          python scripts/build_content_scope_review.py --release-tag "$COLLECTION_TAG" --archive-release-tag "$ARCHIVE_TAG" --assembly-prefix "$ASSEMBLY_PREFIX" --publish-tag "$PUBLISH_TAG" --offset "$RANGE_OFFSET" --limit "$RANGE_LIMIT" "${args[@]}" --publish
