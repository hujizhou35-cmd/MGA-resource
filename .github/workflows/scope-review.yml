name: Build raster and mixed-content scope review
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing collection release
        default: collection-20261106
        type: string
      source_prefix:
        description: Exact togo-RUN-ATTEMPT source prefix
        required: true
        type: string
      archive_release_tag:
        description: Original and preview archive Release
        default: collection-20261106
        type: string
      publish_tag:
        description: Separate review evidence output Release
        default: acceptance-20261107
        type: string
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Stream existing preview archives into bounded contact sheets
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECTION_TAG: ${{ inputs.release_tag }}
          SOURCE_PREFIX: ${{ inputs.source_prefix }}
          ARCHIVE_TAG: ${{ inputs.archive_release_tag }}
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: python scripts/build_scope_review.py --release-tag "$COLLECTION_TAG" --archive-release-tag "$ARCHIVE_TAG" --source-prefix "$SOURCE_PREFIX" --publish-tag "$PUBLISH_TAG" --publish
