name: Audit current public scope using metadata only
on:
  workflow_dispatch:
    inputs:
      assembly_prefix:
        description: Exact catalog and SQLite metadata assembly prefix
        type: string
        default: assembly-42320673266-1
        required: true
      assembly_release_tag:
        description: Release containing the public assembly metadata
        type: string
        default: acceptance-20261107
      assembly_report_sha256:
        description: Exact report SHA binding the public and internal catalogs
        type: string
        required: true
      equivalence_url:
        description: Actual metadata-only equivalence workflow proof URL
        type: string
        required: true
      equivalence_sha256:
        description: Exact equivalence proof SHA-256
        type: string
        required: true
      evidence_tag:
        description: Separate Release for the small scope audit report
        type: string
        default: acceptance-20261107
permissions:
  contents: write
concurrency:
  group: scope-metadata-audit-${{ inputs.assembly_prefix }}
  cancel-in-progress: false
jobs:
  metadata-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test exact metadata bindings with synthetic evidence
        run: |
          python -m pip install 'pytest>=8,<10'
          python -m pytest -q tests/test_public_scope_audit.py tests/test_scope_metadata_audit.py
      - name: Download and audit metadata on this cloud runner
        env:
          GH_TOKEN: ${{ github.token }}
          ASSEMBLY_PREFIX: ${{ inputs.assembly_prefix }}
          ASSEMBLY_TAG: ${{ inputs.assembly_release_tag }}
          REPORT_SHA: ${{ inputs.assembly_report_sha256 }}
          EQUIVALENCE_URL: ${{ inputs.equivalence_url }}
          EQUIVALENCE_SHA: ${{ inputs.equivalence_sha256 }}
          EVIDENCE_TAG: ${{ inputs.evidence_tag }}
        run: |
          python scripts/audit_scope_metadata.py --assembly-prefix "$ASSEMBLY_PREFIX" --assembly-release-tag "$ASSEMBLY_TAG" --assembly-report-sha256 "$REPORT_SHA" --equivalence-url "$EQUIVALENCE_URL" --equivalence-sha256 "$EQUIVALENCE_SHA" --evidence-tag "$EVIDENCE_TAG" --publish
      - name: Preserve small scope evidence, excluding downloaded input metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scope-metadata-audit-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/scope-metadata-audit/*.scope-audit.json
            build/scope-metadata-audit/*.summary.json
            build/scope-metadata-audit/publish-receipts.json
