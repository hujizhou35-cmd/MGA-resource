name: Deploy MGA workbench
on:
  push:
    branches: ['codex/mga-workbench']
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        options: [preview, production]
        required: true
      verified_preview_run:
        description: Required for production; accepted preview run at this same commit.
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: website-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_ACCOUNT_ID: 104f09363abf61ba85c8266b39593ceb
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check preview gate for production
        if: inputs.stage == 'production'
        env:
          PREVIEW_RUN: ${{ inputs.verified_preview_run }}
        run: |
          [[ "$PREVIEW_RUN" =~ ^[0-9]+$ ]]
          gh run view "$PREVIEW_RUN" --json conclusion,headSha,workflowName > /tmp/mga-preview-run.json
          gh run download "$PREVIEW_RUN" --name "workbench-preview-$PREVIEW_RUN" --dir build/preview-proof
          python -c 'import os,json,pathlib; r=json.loads(pathlib.Path("/tmp/mga-preview-run.json").read_text()); p=list(pathlib.Path("build/preview-proof").rglob("upgrade-verification.json")); assert r["conclusion"]=="success" and r["headSha"]==os.environ["GITHUB_SHA"] and r["workflowName"]=="Deploy MGA workbench" and len(p)==1; q=json.loads(p[0].read_text()); assert q["parity_passed"]==142 and q["control_failures"]==[] and q["commit"]==r["headSha"]'
      - uses: actions/download-artifact@v4
        with:
          name: website-prepared-43485204419
          run-id: '43485204419'
          github-token: ${{ github.token }}
          path: build/website
      - run: python -m pip install -e .
      - run: python scripts/prepare_workbench.py
      - run: npm ci --ignore-scripts
        working-directory: site
      - name: Deploy only the main project
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          STAGE: ${{ inputs.stage || 'preview' }}
        run: |
          set -o pipefail
          if [[ "$STAGE" == production ]]; then branch=main; else branch=workbench-preview; fi
          npx wrangler pages deploy ../build/website/public --project-name mga-resource-mainly-for-agent --branch "$branch" --commit-hash "$GITHUB_SHA" 2>&1 | tee ../build/website/upgrade-deploy.txt
          python -c 'import re,pathlib; p=pathlib.Path("../build/website"); urls=re.findall(r"https://[a-z0-9-]+\.mga-resource-mainly-for-agent\.pages\.dev", (p/"upgrade-deploy.txt").read_text()); assert urls; (p/"upgrade-url.txt").write_text(urls[0]+"\n")'
      - name: Load previously verified search parity
        if: inputs.stage != 'production'
        run: gh run download 43543510193 --name workbench-preview-43543510193 --dir build/workbench-parity
      - name: Verify preview against frozen requests
        if: inputs.stage != 'production'
        run: python scripts/verify_workbench.py
      - name: Verify production smoke
        if: inputs.stage == 'production'
        run: python scripts/verify_workbench.py --production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-${{ inputs.stage || 'preview' }}-${{ github.run_id }}
          retention-days: 30
          path: |
            build/website/workbench-receipt.json
            build/website/upgrade-*.txt
            build/website/upgrade-verification.json
            build/website/upgrade-http.jsonl
            build/website/public/catalog-info.json
