name: Check collection tooling
on:
  push:
    paths: ['mga_resources/**', 'scripts/**', 'tests/**', 'data/**', 'site/**', 'pyproject.toml', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: node --test tests/test_website_api.mjs tests/test_workbench.mjs
