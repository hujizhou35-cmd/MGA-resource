[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mga-resources"
version = "0.1.0"
description = "Cloud-built medical illustration catalog, mainly for agents"
requires-python = ">=3.12"
dependencies = ["Pillow>=11,<13", "CairoSVG>=2.7,<3", "defusedxml>=0.7,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["mga_resources*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
